      .bin-rect:hover { fill: #0f62fe; stroke: #ffffff; }
      .bin-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .title-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: bold; fill: #f4f4f4; }
    </style>
  </defs>

  <!-- Layout Layer -->
