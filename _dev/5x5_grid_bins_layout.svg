    <text class="title-text" x="25" y="35">STORAGE RACK Z-PICKER — 5x5 BINS MATRIX</text>
  </g>

  <!-- Bins Layer (RoomLocation Tier Shape Extraction Target) -->
  <g id="bins" inkscape:label="bins">
