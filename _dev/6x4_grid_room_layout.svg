<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="800"
   height="550"
   viewBox="0 0 800 550"
   version="1.1"
   id="svg_6x4_grid"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-floor { fill: #161616; stroke: #393939; stroke-width: 4; }
      .grid-wall { fill: none; stroke: #525252; stroke-width: 2; stroke-dasharray: 4 4; }
      .location-rect { fill: #162d50; stroke: #4589ff; stroke-width: 2; cursor: pointer; transition: all 0.2s ease; }
      .location-rect:hover { fill: #0f62fe; stroke: #ffffff; }
      .label-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; fill: #c6c6c6; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .title-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: bold; fill: #f4f4f4; }
    </style>
  </defs>

  <!-- Floor & Layout Layer -->
  <g id="layout" inkscape:label="layout">
    <rect class="bg-floor" x="20" y="20" width="760" height="510" rx="0" />
    <text class="title-text" x="40" y="50">MAIN WAREHOUSE — 6x4 GRID STORAGE ROOM</text>
  </g>

  <!-- Locations Layer (Room Tier Shape Extraction Target: 4 Rows x 6 Columns) -->
  <g id="locations" inkscape:label="locations">
    <!-- Row 0001 -->
    <rect class="location-rect" x="50" y="80" width="105" height="90" inkscape:label="0001-0001" id="loc_0001_0001" />
    <rect class="location-rect" x="168" y="80" width="105" height="90" inkscape:label="0001-0002" id="loc_0001_0002" />
