    <rect class="location-rect" x="640" y="80" width="105" height="90" inkscape:label="0001-0006" id="loc_0001_0006" />

    <!-- Row 0002 -->
    <rect class="location-rect" x="50" y="185" width="105" height="90" inkscape:label="0002-0001" id="loc_0002_0001" />
