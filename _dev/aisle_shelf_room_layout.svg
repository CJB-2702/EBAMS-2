<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1200"
   height="800"
   viewBox="0 0 1200 800"
   version="1.1"
   id="svg_aisle_shelf_room"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-floor { fill: #161616; stroke: #393939; stroke-width: 4; }
      .aisle-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #a8a8a8; text-anchor: middle; }
      .rack-rect { fill: #162d50; stroke: #0f62fe; stroke-width: 2; cursor: pointer; }
      .rack-rect:hover { fill: #0f62fe; stroke: #ffffff; }
      .title-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: bold; fill: #f4f4f4; }
    </style>
  </defs>

  <g id="layout" inkscape:label="layout">
    <rect class="bg-floor" x="20" y="20" width="1160" height="760" />
    <text class="title-text" x="40" y="55">DISTRIBUTION CENTER — AISLE &amp; RACK TOPOGRAPHY</text>
    
    <text class="aisle-label" x="175" y="100">AISLE A1</text>
    <text class="aisle-label" x="475" y="100">AISLE A2</text>
    <text class="aisle-label" x="775" y="100">AISLE A3</text>
    <text class="aisle-label" x="1075" y="100">AISLE A4</text>
  </g>

  <!-- Locations Layer -->
  <g id="locations" inkscape:label="locations">
    <!-- Aisle A1 (Major 0001) -->
    <rect class="rack-rect" x="80" y="130" width="190" height="100" inkscape:label="0001-0001" id="loc_0001_0001" />
    <rect class="rack-rect" x="80" y="250" width="190" height="100" inkscape:label="0001-0002" id="loc_0001_0002" />
    <rect class="rack-rect" x="80" y="370" width="190" height="100" inkscape:label="0001-0003" id="loc_0001_0003" />
    <rect class="rack-rect" x="80" y="490" width="190" height="100" inkscape:label="0001-0004" id="loc_0001_0004" />
    <rect class="rack-rect" x="80" y="610" width="190" height="100" inkscape:label="0001-0005" id="loc_0001_0005" />

    <!-- Aisle A2 (Major 0002) -->
    <rect class="rack-rect" x="380" y="130" width="190" height="100" inkscape:label="0002-0001" id="loc_0002_0001" />
    <rect class="rack-rect" x="380" y="250" width="190" height="100" inkscape:label="0002-0002" id="loc_0002_0002" />
    <rect class="rack-rect" x="380" y="370" width="190" height="100" inkscape:label="0002-0003" id="loc_0002_0003" />
    <rect class="rack-rect" x="380" y="490" width="190" height="100" inkscape:label="0002-0004" id="loc_0002_0004" />
    <rect class="rack-rect" x="380" y="610" width="190" height="100" inkscape:label="0002-0005" id="loc_0002_0005" />

    <!-- Aisle A3 (Major 0003) -->
    <rect class="rack-rect" x="680" y="130" width="190" height="100" inkscape:label="0003-0001" id="loc_0003_0001" />
    <rect class="rack-rect" x="680" y="250" width="190" height="100" inkscape:label="0003-0002" id="loc_0003_0002" />
    <rect class="rack-rect" x="680" y="370" width="190" height="100" inkscape:label="0003-0003" id="loc_0003_0003" />
    <rect class="rack-rect" x="680" y="490" width="190" height="100" inkscape:label="0003-0004" id="loc_0003_0004" />
    <rect class="rack-rect" x="680" y="610" width="190" height="100" inkscape:label="0003-0005" id="loc_0003_0005" />

    <!-- Aisle A4 (Major 0004) -->
    <rect class="rack-rect" x="980" y="130" width="190" height="100" inkscape:label="0004-0001" id="loc_0004_0001" />
    <rect class="rack-rect" x="980" y="250" width="190" height="100" inkscape:label="0004-0002" id="loc_0004_0002" />
    <rect class="rack-rect" x="980" y="370" width="190" height="100" inkscape:label="0004-0003" id="loc_0004_0003" />
    <rect class="rack-rect" x="980" y="490" width="190" height="100" inkscape:label="0004-0004" id="loc_0004_0004" />
    <rect class="rack-rect" x="980" y="610" width="190" height="100" inkscape:label="0004-0005" id="loc_0004_0005" />
  </g>
</svg>
