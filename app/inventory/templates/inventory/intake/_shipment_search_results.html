{% for shp in unfulfilled_shipments %}
<tr id="shipment-row-{{ shp.pk }}">
  <td>
    <input type="checkbox" name="shipment_ids" value="{{ shp.pk }}" id="shipment-check-{{ shp.pk }}">
  </td>
  <td class="has-text-weight-bold">{{ shp.shipment_number }}</td>
  <td>{{ shp.purchase_order.po_number|default:"—" }}</td>
  <td>{{ shp.purchase_order.vendor.name|default:"—" }}</td>
  <td><span class="tag is-info is-light">{{ shp.status }}</span></td>
  <td>{{ shp.open_line_count }} open line(s)</td>
</tr>
{% empty %}
<tr>
  <td colspan="6" class="has-text-grey is-size-7">No unfulfilled shipments found.</td>
</tr>
{% endfor %}
