{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/carbon_colors.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom_bulma.css' %}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{% static 'css/custom_bulma.dark.css' %}" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{% static 'css/color_overrides.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom_css.css' %}">
  <link rel="stylesheet" href="{% static 'css/public_marketing.css' %}">
</head>
<body>

{% include "shared/public_topnav.html" %}
{% include "shared/_login_modal.html" %}

<section class="section">
  <div class="container" style="max-width: {% block container_max_width %}720px{% endblock %};">
    {% if messages %}
      {% for message in messages %}
        <div class="notification is-info is-light">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</section>
</body>
</html>
