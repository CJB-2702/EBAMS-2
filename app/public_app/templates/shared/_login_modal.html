<dialog id="public-login-modal" class="card modal-styled" style="padding:0; max-width: 420px;">
  <header class="card-header">
    <p class="card-header-title">Sign in</p>
    <button class="delete is-large" aria-label="close" commandfor="public-login-modal" command="close"></button>
  </header>
  <div class="card-content">
    <div class="mb-4">
      <a href="{% url 'oidc_authentication_init' %}" class="button is-link is-fullwidth">
        <span class="icon"><span class="material-icons" aria-hidden="true">account_circle</span></span>
        <span>Sign in with Microsoft</span>
      </a>
    </div>

    <div style="text-align:center; font-size:0.78rem; color:var(--bulma-text-weak); margin-bottom:1rem;">
      or use username and password
    </div>

    <form method="post" action="{% url 'public_home' %}">
      {% csrf_token %}
      <input type="hidden" name="action" value="login">
      <input type="hidden" name="next" value="{{ request.path }}">
      <div class="field">
        <label class="label is-small" for="public-login-username">Username</label>
        <div class="control">
          <input id="public-login-username" class="input" type="text" name="username" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label class="label is-small" for="public-login-password">Password</label>
        <div class="control">
          <input id="public-login-password" class="input" type="password" name="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="field mt-4">
        <button type="submit" class="button is-link is-fullwidth">
          <span class="icon"><span class="material-icons" aria-hidden="true">login</span></span>
          <span>Sign in</span>
        </button>
      </div>
    </form>
  </div>
</dialog>
