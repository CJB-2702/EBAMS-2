{# Rows for <search-dropdown name="assigned_user_id">. The active-load count is
   the point: it turns a name picker into an assignment decision. #}
<ul>
  {% for tech in technicians %}
  <li data-value="{{ tech.pk }}">{{ tech.get_username }} — {{ tech.active_count }} active</li>
  {% empty %}
  <li class="has-text-grey">No technicians match.</li>
  {% endfor %}
</ul>
