<dual-list-box id="plan-models-dlb">
  <list-box slot="left" id="plan-models-avail" label="Available models">
    <select slot="options" multiple>
      {% for item in models_available %}
      <option value="{{ item.pk }}">{{ item }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'plan_move_asset_models' plan.pk %}"
            hx-vals="js:{asset_model_ids: listBox('plan-models-avail').selected(), direction: 'add'}"
            hx-target="#plan-models-dlb"
            hx-swap="outerHTML swap:1s"
            title="Add selected models">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'plan_move_asset_models' plan.pk %}"
            hx-vals="js:{asset_model_ids: listBox('plan-models-held').selected(), direction: 'remove'}"
            hx-target="#plan-models-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected models">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="plan-models-held" label="Tagged on this plan">
    <select slot="options" multiple>
      {% for item in models_assigned %}
      <option value="{{ item.pk }}">{{ item }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
