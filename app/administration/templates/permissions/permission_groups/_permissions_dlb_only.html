<dual-list-box id="pg-perms-dlb">
  <list-box slot="left" id="pg-perms-avail" label="Available permissions">
    <select slot="options" multiple>
      {% for item in permissions_available %}
      <option value="{{ item.pk }}">{{ item.content_type.app_label }} | {{ item.content_type.model }} | {{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'permission_group_move_permissions' group.pk %}"
            hx-vals="js:{permission_ids: listBox('pg-perms-avail').selected(), direction: 'add'}"
            hx-target="#pg-perms-dlb"
            hx-swap="outerHTML swap:1s"
            title="Add selected permissions">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'permission_group_move_permissions' group.pk %}"
            hx-vals="js:{permission_ids: listBox('pg-perms-held').selected(), direction: 'remove'}"
            hx-target="#pg-perms-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected permissions">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="pg-perms-held" label="In this group">
    <select slot="options" multiple>
      {% for item in permissions_assigned %}
      <option value="{{ item.pk }}">{{ item.content_type.app_label }} | {{ item.content_type.model }} | {{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
