<dual-list-box id="role-users-dlb">
  <list-box slot="left" id="role-users-avail" label="Available users">
    <select slot="options" multiple>
      {% for item in users_available %}
      <option value="{{ item.pk }}">{{ item.username }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'role_move_users' role.slug %}"
            hx-vals="js:{user_ids: listBox('role-users-avail').selected(), direction: 'add'}"
            hx-target="#role-users-dlb"
            hx-swap="outerHTML swap:1s"
            title="Assign selected users to role">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'role_move_users' role.slug %}"
            hx-vals="js:{user_ids: listBox('role-users-held').selected(), direction: 'remove'}"
            hx-target="#role-users-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected users from role">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="role-users-held" label="Assigned users">
    <select slot="options" multiple>
      {% for item in users_assigned %}
      <option value="{{ item.pk }}">{{ item.username }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
