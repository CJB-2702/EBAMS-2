<dual-list-box id="role-pg-dlb">
  <list-box slot="left" id="role-pg-avail" label="Available permission groups">
    <select slot="options" multiple>
      {% for item in permission_groups_available %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'role_move_permission_groups' role.slug %}"
            hx-vals="js:{permission_group_ids: listBox('role-pg-avail').selected(), direction: 'add'}"
            hx-target="#role-pg-dlb"
            hx-swap="outerHTML swap:1s"
            title="Add selected permission groups">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'role_move_permission_groups' role.slug %}"
            hx-vals="js:{permission_group_ids: listBox('role-pg-held').selected(), direction: 'remove'}"
            hx-target="#role-pg-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected permission groups">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="role-pg-held" label="In this role">
    <select slot="options" multiple>
      {% for item in permission_groups_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
