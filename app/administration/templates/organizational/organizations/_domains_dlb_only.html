<dual-list-box id="org-domains-dlb">
  <list-box slot="left" id="org-domains-avail" label="Available domains">
    <select slot="options" multiple>
      {% for item in domains_available %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'organization_move_domains' organization.pk %}"
            hx-vals="js:{domain_ids: listBox('org-domains-avail').selected(), direction: 'add'}"
            hx-target="#org-domains-dlb"
            hx-swap="outerHTML swap:1s"
            title="Link selected domains">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'organization_move_domains' organization.pk %}"
            hx-vals="js:{domain_ids: listBox('org-domains-held').selected(), direction: 'remove'}"
            hx-target="#org-domains-dlb"
            hx-swap="outerHTML swap:1s"
            title="Unlink selected domains">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="org-domains-held" label="Linked to this organization">
    <select slot="options" multiple>
      {% for item in domains_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
