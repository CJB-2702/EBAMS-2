<dual-list-box id="div-orgs-dlb">
  <list-box slot="left" id="div-orgs-avail" label="Available organizations">
    <select slot="options" multiple>
      {% for item in organizations_available %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'division_move_organizations' division.pk %}"
            hx-vals="js:{organization_ids: listBox('div-orgs-avail').selected(), direction: 'add'}"
            hx-target="#div-orgs-dlb"
            hx-swap="outerHTML swap:1s"
            title="Link selected organizations">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'division_move_organizations' division.pk %}"
            hx-vals="js:{organization_ids: listBox('div-orgs-held').selected(), direction: 'remove'}"
            hx-target="#div-orgs-dlb"
            hx-swap="outerHTML swap:1s"
            title="Unlink selected organizations">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="div-orgs-held" label="Linked to this division">
    <select slot="options" multiple>
      {% for item in organizations_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
