<dual-list-box id="up-orgs-dlb">
  <list-box slot="left" id="up-orgs-avail" label="Available organizations">
    <select slot="options" multiple>
      {% for item in organizations_available %}
      <option value="{{ item.pk }}">{{ item.name }}{% if item.division %} — {{ item.division.name }}{% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_organizations' target_user.pk %}"
            hx-vals="js:{organization_ids: listBox('up-orgs-avail').selected(), direction: 'add'}"
            hx-target="#up-orgs-dlb"
            hx-swap="outerHTML swap:1s"
            title="Assign selected organizations">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_organizations' target_user.pk %}"
            hx-vals="js:{organization_ids: listBox('up-orgs-held').selected(), direction: 'remove'}"
            hx-target="#up-orgs-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected organizations">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="up-orgs-held" label="Assigned organizations">
    <select slot="options" multiple>
      {% for item in organizations_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}{% if item.division %} — {{ item.division.name }}{% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
