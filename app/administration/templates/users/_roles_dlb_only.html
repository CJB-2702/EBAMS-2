<dual-list-box id="up-roles-dlb">
  <list-box slot="left" id="up-roles-avail" label="Available roles">
    <select slot="options" multiple>
      {% for item in roles_available %}
      <option value="{{ item.pk }}">{{ item.name }}{% if item.parent_role %} (specializes {{ item.parent_role.name }}){% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_roles' target_user.pk %}"
            hx-vals="js:{role_ids: listBox('up-roles-avail').selected(), direction: 'add'}"
            hx-target="#up-roles-dlb"
            hx-swap="outerHTML swap:1s"
            title="Assign selected roles">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_roles' target_user.pk %}"
            hx-vals="js:{role_ids: listBox('up-roles-held').selected(), direction: 'remove'}"
            hx-target="#up-roles-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected roles">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="up-roles-held" label="Assigned roles">
    <select slot="options" multiple>
      {% for item in roles_assigned_for_listbox %}
      <option value="{{ item.pk }}">{{ item.name }}{% if item.parent_role %} (specializes {{ item.parent_role.name }}){% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
