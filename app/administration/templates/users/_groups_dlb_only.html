<dual-list-box id="up-groups-dlb">
  <list-box slot="left" id="up-groups-avail" label="Available permission groups">
    <select slot="options" multiple>
      {% for item in groups_available %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_groups' target_user.pk %}"
            hx-vals="js:{group_ids: listBox('up-groups-avail').selected(), direction: 'add'}"
            hx-target="#up-groups-dlb"
            hx-swap="outerHTML swap:1s"
            title="Add selected groups">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'user_move_groups' target_user.pk %}"
            hx-vals="js:{group_ids: listBox('up-groups-held').selected(), direction: 'remove'}"
            hx-target="#up-groups-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected groups">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="up-groups-held" label="Assigned permission groups">
    <select slot="options" multiple>
      {% for item in groups_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
