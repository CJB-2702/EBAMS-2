<dual-list-box id="dom-users-dlb">
  <list-box slot="left" id="dom-users-avail" label="Available users">
    <select slot="options" multiple>
      {% for item in users_available %}
      <option value="{{ item.pk }}">{{ item.username }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'domain_move_users' domain.pk %}"
            hx-vals="js:{user_ids: listBox('dom-users-avail').selected(), direction: 'add'}"
            hx-target="#dom-users-dlb"
            hx-swap="outerHTML swap:1s"
            title="Grant selected users access">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'domain_move_users' domain.pk %}"
            hx-vals="js:{user_ids: listBox('dom-users-held').selected(), direction: 'remove'}"
            hx-target="#dom-users-dlb"
            hx-swap="outerHTML swap:1s"
            title="Revoke selected users access">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="dom-users-held" label="Users with access">
    <select slot="options" multiple>
      {% for item in users_assigned %}
      <option value="{{ item.pk }}">{{ item.username }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
