<dual-list-box id="dt-domains-dlb">
  <list-box slot="left" id="dt-domains-avail" label="Available domains">
    <select slot="options" multiple>
      {% for item in domains_available %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'domain_template_move_domains' template.slug %}"
            hx-vals="js:{domain_ids: listBox('dt-domains-avail').selected(), direction: 'add'}"
            hx-target="#dt-domains-dlb"
            hx-swap="outerHTML swap:1s"
            title="Add selected domains to template">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'domain_template_move_domains' template.slug %}"
            hx-vals="js:{domain_ids: listBox('dt-domains-held').selected(), direction: 'remove'}"
            hx-target="#dt-domains-dlb"
            hx-swap="outerHTML swap:1s"
            title="Remove selected domains from template">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="dt-domains-held" label="In this template">
    <select slot="options" multiple>
      {% for item in domains_assigned %}
      <option value="{{ item.pk }}">{{ item.name }}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
