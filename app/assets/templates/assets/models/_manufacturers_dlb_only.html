<dual-list-box id="mfr-dlb">
  <list-box slot="left" id="mfr-avail" label="Available manufacturers">
    <select slot="options" multiple>
      {% for mf in manufacturers_available %}
      <option value="{{ mf.id }}">{{ mf.name }}{% if mf.code %} ({{ mf.code }}){% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
  <div slot="controls">
    <button type="button" class="button is-small"
            hx-post="{% url 'model_move_manufacturers' model.id %}"
            hx-vals="js:{manufacturer_ids: listBox('mfr-avail').selected(), direction: 'add'}"
            hx-target="#mfr-dlb"
            hx-swap="outerHTML swap:1s"
            title="Link selected manufacturers">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_forward</span></span>
    </button>
    <button type="button" class="button is-small"
            hx-post="{% url 'model_move_manufacturers' model.id %}"
            hx-vals="js:{manufacturer_ids: listBox('mfr-held').selected(), direction: 'remove'}"
            hx-target="#mfr-dlb"
            hx-swap="outerHTML swap:1s"
            title="Unlink selected manufacturers">
      <span class="icon"><span class="material-icons" aria-hidden="true">arrow_back</span></span>
    </button>
  </div>
  <list-box slot="right" id="mfr-held" label="Linked to this model">
    <select slot="options" multiple>
      {% for mf in manufacturers_assigned %}
      <option value="{{ mf.id }}">{{ mf.name }}{% if mf.code %} ({{ mf.code }}){% endif %}</option>
      {% endfor %}
    </select>
  </list-box>
</dual-list-box>
